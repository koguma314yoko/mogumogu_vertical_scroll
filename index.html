<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>もぐもぐフォレスト RUSH</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b1b;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;touch-action:none}
  #stage{position:fixed;left:50%;top:50%;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);transform:translate(-50%,-50%);overflow:hidden;background:#163b24;box-shadow:0 0 60px #0008}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{position:absolute;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #17351f,0 0 3px #17351f}
  .hud{display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 16px 0;font-weight:900}
  .pill{min-width:105px;padding:9px 13px;border:2px solid #ffffffcc;border-radius:18px;background:#153d2ac9;box-shadow:0 4px 12px #0005;backdrop-filter:blur(4px)}
  #heartBox{min-width:116px;text-align:center}#hearts{font-size:22px;letter-spacing:2px;white-space:nowrap}
  .value{display:block;font-size:25px;line-height:1}.label{display:block;font-size:10px;letter-spacing:.12em;opacity:.9;margin-bottom:4px}
  #timeBox{text-align:center;min-width:82px}#time{font-size:30px}
  #feverWrap{position:absolute;top:84px;left:50%;width:min(78vw,390px);transform:translateX(-50%);height:18px;border:2px solid #fff;border-radius:20px;background:#102418cc;overflow:hidden;box-shadow:0 3px 10px #0005}
  #feverBar{width:0;height:100%;background:linear-gradient(90deg,#ffd83d,#ff7b35,#ff44cd);transition:width .15s}
  #feverLabel{position:absolute;top:106px;left:50%;transform:translateX(-50%);font-weight:900;font-size:11px;letter-spacing:.15em}
  #combo{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%) scale(.6);font-size:38px;font-weight:1000;color:#fff36a;opacity:0;transition:.15s}
  #combo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #message{position:absolute;top:38%;left:50%;width:100%;transform:translate(-50%,-50%);text-align:center;font-size:42px;font-weight:1000;color:#fff36a;opacity:0}
  #message.pop{animation:pop .75s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#092a1db8,#092a1de8);pointer-events:auto;color:white;text-align:center}
  .card{width:min(92vw,430px);padding:28px 22px;border:3px solid #fff9;border-radius:30px;background:#174a32e8;box-shadow:0 18px 60px #0008,inset 0 1px #fff5}
  h1{margin:0 0 8px;font-size:clamp(34px,9vw,54px);line-height:.95;color:#fff36a;text-shadow:0 4px #b44b22}p{line-height:1.7}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0;font-weight:800}.good{color:#fff36a}.bad{color:#ff9b9b}
  button{border:0;border-radius:999px;padding:15px 38px;font:900 20px inherit;color:#174a32;background:linear-gradient(#fff56d,#ffc52f);box-shadow:0 6px #d78119,0 10px 20px #0005;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 2px #d78119}
  #result{display:none}.stats{font-size:18px;line-height:2;margin:14px 0}.hint{font-size:12px;opacity:.8;margin-top:17px}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas><div id="flash"></div>
<div id="ui">
  <div class="hud"><div class="pill"><span class="label">SCORE</span><span class="value" id="score">0</span></div><div class="pill" id="heartBox"><span class="label">HEART</span><span class="value" id="hearts">❤️❤️❤️</span></div><div class="pill" id="timeBox"><span class="label">TIME</span><span class="value" id="time">60</span></div></div>
  <div id="feverWrap"><div id="feverBar"></div></div><div id="feverLabel">MOGUMOGU FEVER</div><div id="combo"></div><div id="message"></div>
</div></div>
<div class="screen" id="title"><div class="card"><h1>もぐもぐ<br>フォレスト RUSH</h1><p>左右に動いて、おいしいものを<br>どんどんキャッチしよう！</p><div class="legend"><span class="good">GOOD FOOD +SCORE</span><span class="bad">DANGER −HEART</span></div><button id="start">スタート！</button><div class="hint">スマホ：画面を左右になぞる<br>PC：← → / A D キー<br>ゲームパッド：左スティック / 十字キー</div></div></div>
<div class="screen" id="result"><div class="card"><h1 id="resultTitle">FINISH!</h1><div class="stats">スコア　<b id="finalScore">0</b><br>食べた数　<b id="eaten">0</b><br>最大コンボ　<b id="maxCombo">0</b><br>ベスト　<b id="best">0</b></div><button id="retry">もう一度！</button></div></div>
<audio id="soundEat" src="assets/animal_eat.m4a" preload="auto" playsinline></audio>
<audio id="soundRare" src="assets/animal_rare.m4a" preload="auto" playsinline></audio>
<audio id="soundBad" src="assets/animal_bad.m4a" preload="auto" playsinline></audio>
<audio id="soundStun" src="assets/animal_stun.m4a" preload="auto" playsinline></audio>
<audio id="soundFever" src="assets/animal_fever.m4a" preload="auto" playsinline></audio>
<script>
(()=>{
"use strict";
const ASSETS={player:"assets/Chara000.png",fainting:"assets/Chara000Fainting.png",background:"assets/mogumogu_bg00.png",foreground:"assets/mogumogu_bg01.png"};
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d",{alpha:false}),$=s=>document.querySelector(s);
const els={score:$("#score"),time:$("#time"),hearts:$("#hearts"),bar:$("#feverBar"),combo:$("#combo"),msg:$("#message"),title:$("#title"),result:$("#result"),flash:$("#flash")};
const sounds={eat:$("#soundEat"),rare:$("#soundRare"),bad:$("#soundBad"),stun:$("#soundStun"),fever:$("#soundFever")};
Object.values(sounds).forEach(sound=>sound.volume=.76);
let soundTimer=0,lastEatSound=0,soundBusy=false;
const imgs={}; const W=720,H=1280; let last=0,running=false,elapsed=0,spawnClock=0,bgY=0,fgY=0,score=0,eaten=0,combo=0,maxCombo=0,fever=0,feverTime=0,slowTime=0,stunTime=0,hearts=3,lastRush=false,shake=0,flashA=0;
const objects=[],particles=[],rings=[],texts=[]; const keys={left:false,right:false};
const player={x:0,y:0,w:108,h:108,targetX:null,bob:0,reaction:"",reactionTime:0};
let gamepadActionHeld=false;
const TYPES=[
 {kind:"apple",points:10,w:76,good:true,color:"#ff4b52"},{kind:"strawberry",points:12,w:70,good:true,color:"#ff3d80"},{kind:"donut",points:20,w:82,good:true,color:"#ff9bd5"},{kind:"cake",points:30,w:88,good:true,color:"#fff16b"},{kind:"grapes",points:15,w:76,good:true,color:"#a876ff"},{kind:"burger",points:25,w:85,good:true,color:"#ffad3d"},{kind:"honey",points:100,w:106,good:true,rare:true,color:"#ffd629"},
 {kind:"bomb",points:-30,w:79,bad:true,color:"#ff3838"},{kind:"boot",points:0,w:78,bad:true,stun:true,color:"#a87655"},{kind:"skull",points:-25,w:80,bad:true,color:"#d8e1d8"}
];
function load(){return Promise.all(Object.entries(ASSETS).map(([k,src])=>new Promise(resolve=>{let im=new Image; im.onload=()=>{imgs[k]=im;resolve()};im.onerror=resolve;im.src=src})));}
function unlockSound(){Object.values(sounds).forEach(sound=>{sound.muted=true;sound.currentTime=0;let p=sound.play();if(p)p.then(()=>{sound.pause();sound.currentTime=0;sound.muted=false}).catch(()=>{sound.muted=false})})}
function stopSounds(){clearTimeout(soundTimer);Object.values(sounds).forEach(sound=>{sound.pause();sound.currentTime=0});soundBusy=false}
function playCue(name){let now=performance.now();if(soundBusy)return;if(name==="eat"&&now-lastEatSound<520)return;if(name==="eat")lastEatSound=now;let sound=sounds[name];if(!sound)return;soundBusy=true;sound.muted=false;sound.volume=name==="bad"||name==="stun"?.84:.76;sound.currentTime=0;let finish=()=>{clearTimeout(soundTimer);soundBusy=false};sound.onended=finish;let p=sound.play();if(p)p.catch(finish);soundTimer=setTimeout(()=>{if(!sound.paused)sound.pause();finish()},Math.max(500,(Number.isFinite(sound.duration)?sound.duration*1000:2600)+150))}
function resize(){canvas.width=W;canvas.height=H;player.w=180;player.h=180;player.y=H-player.h-155;player.x=Math.max(8,Math.min(W-player.w-8,player.x||W/2-player.w/2));}
function reset(){elapsed=spawnClock=bgY=fgY=score=eaten=combo=maxCombo=fever=feverTime=slowTime=stunTime=shake=0;hearts=3;lastRush=false;objects.length=particles.length=rings.length=texts.length=0;player.x=W/2-player.w/2;player.targetX=null;player.reaction="";player.reactionTime=0;updateUI();}
function start(){reset();els.title.style.display="none";els.result.style.display="none";stopSounds();unlockSound();running=true;last=performance.now();requestAnimationFrame(loop);}
function end(gameOver=false){running=false;if(!gameOver)stopSounds();$("#resultTitle").textContent=gameOver?"GAME OVER":"FINISH!";let best=Math.max(score,+(localStorage.mogumoguBest||0));localStorage.mogumoguBest=best;$("#finalScore").textContent=score;$("#eaten").textContent=eaten;$("#maxCombo").textContent=maxCombo;$("#best").textContent=best;els.result.style.display="flex";}
function spawn(){let badChance=.15+Math.min(.09,elapsed/300),t;if(Math.random()<.035)t=TYPES.find(x=>x.rare);else{let pool=badChance>Math.random()?TYPES.filter(x=>x.bad):TYPES.filter(x=>x.good&&!x.rare);t=pool[Math.random()*pool.length|0]}objects.push({t,x:15+Math.random()*(W-t.w-30),y:-t.w-10,size:t.w*(.8+Math.random()*.35),rot:(Math.random()-.5)*.5,spin:(Math.random()-.5)*1.7,sway:Math.random()*6.28,hit:false});}
function burst(x,y,color,bad=false){rings.push({x,y,r:8,a:1,color,bad});for(let i=0;i<(bad?12:18);i++){let a=Math.random()*Math.PI*2,s=(bad?120:180)*(0.35+Math.random());particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.4+Math.random()*.35,max:.75,size:3+Math.random()*6,color:Math.random()<.35?"#fff":color,star:false});}flashA=bad?.32:.2;els.flash.style.background=bad?"#ff2424":color;shake=bad?11:4;}
function collect(o){o.hit=true;let cx=o.x+o.size/2,cy=o.y+o.size/2;if(o.t.good){player.reaction="happy";player.reactionTime=.58;combo++;maxCombo=Math.max(maxCombo,combo);eaten++;let mult=1+Math.min(3,Math.floor(combo/6));let gain=Math.round(o.t.points*mult*(feverTime>0?2:1)*(lastRush?1.5:1));score+=gain;fever=Math.min(100,fever+(o.t.rare?32:8));burst(cx,cy,o.t.color);texts.push({x:cx,y:cy,text:"+"+gain,color:"#fff36a",life:1});if(o.t.rare){message("GOLDEN FOOD!!");playCue("rare",true)}else if(Math.random()<.34)playCue("eat");if(combo>=3){els.combo.textContent=combo+" COMBO ×"+mult;els.combo.classList.add("show")}if(fever>=100&&feverTime<=0){fever=0;feverTime=6;message("FEVER!!");playCue("fever",true)}}
else{combo=0;els.combo.classList.remove("show");if(o.t.stun){player.reaction="stun";player.reactionTime=3;stunTime=3;slowTime=0;message("FAINT! 3 SECONDS");burst(cx,cy,o.t.color,true);texts.push({x:cx,y:cy,text:"STUN 3s",color:"#ffcf77",life:1});updateUI();playCue("stun",true);return}player.reaction="sad";player.reactionTime=.9;score=Math.max(0,score+o.t.points);hearts=Math.max(0,hearts-1);if(hearts<=0){player.reaction="stun";player.reactionTime=2;slowTime=0;message("GAME OVER!");burst(cx,cy,o.t.color,true);texts.push({x:cx,y:cy,text:String(o.t.points),color:"#ff7777",life:1});updateUI();playCue("stun",true);end(true);return}else{playCue("bad",true);message("OUCH!")}burst(cx,cy,o.t.color,true);texts.push({x:cx,y:cy,text:String(o.t.points),color:"#ff7777",life:1});}updateUI();}
function message(s){els.msg.textContent=s;els.msg.classList.remove("pop");void els.msg.offsetWidth;els.msg.classList.add("pop")}
function activeGamepad(){if(!navigator.getGamepads)return null;let pads=navigator.getGamepads();for(let i=0;i<pads.length;i++)if(pads[i])return pads[i];return null}
function gamepadX(){let gp=activeGamepad();if(!gp)return 0;let x=gp.axes&&gp.axes.length?gp.axes[0]||0:0;if(Math.abs(x)<.18)x=0;if(gp.buttons[14]&&gp.buttons[14].pressed)x=-1;if(gp.buttons[15]&&gp.buttons[15].pressed)x=1;return x}
function update(dt){elapsed+=dt;if(elapsed>=60){end();return}if(elapsed>=50&&!lastRush){lastRush=true;message("LAST RUSH!!");flashA=.45;els.flash.style.background="#ffd629"}let speed=(340+elapsed*5.5)*(slowTime>0?.56:1)*(feverTime>0?1.2:1)*(lastRush?1.45:1);bgY=(bgY+speed*.38*dt)%H;fgY=(fgY+speed*.82*dt)%H;spawnClock-=dt;let interval=Math.max(.105,.34-elapsed*.0027)*(feverTime>0?.68:1)*(lastRush?.55:1);if(spawnClock<=0){spawn();spawnClock=interval*(.7+Math.random()*.65)}
let keyboardMove=(keys.right?1:0)-(keys.left?1:0),padMove=gamepadX(),move=Math.abs(padMove)>.01?padMove:keyboardMove;if(stunTime<=0){if(move)player.x+=move*520*dt;if(player.targetX!=null)player.x+=(player.targetX-player.w/2-player.x)*Math.min(1,dt*15)}player.x=Math.max(6,Math.min(W-player.w-6,player.x));player.bob+=dt*10;if(player.reactionTime>0){player.reactionTime-=dt;if(player.reactionTime<=0)player.reaction="";}
let px=player.x+player.w*.2,py=player.y+player.h*.24,pw=player.w*.6,ph=player.h*.64;
for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.y+=speed*dt;o.rot+=o.spin*dt;o.x+=Math.sin(elapsed*3+o.sway)*12*dt;if(stunTime<=0&&!o.hit&&o.x+o.size*.8>px&&o.x+o.size*.2<px+pw&&o.y+o.size*.82>py&&o.y+o.size*.18<py+ph){collect(o);if(!running)return}if(o.hit||o.y>H+80)objects.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;if(p.life<=0)particles.splice(i,1)}
for(let i=rings.length-1;i>=0;i--){rings[i].r+=260*dt;rings[i].a-=dt*1.8;if(rings[i].a<=0)rings.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=70*dt;if(texts[i].life<=0)texts.splice(i,1)}
if(feverTime>0){feverTime-=dt;if(feverTime<=0)message("FEVER END")}if(slowTime>0)slowTime-=dt;if(stunTime>0){stunTime-=dt;if(stunTime<=0)message("RECOVER!")}shake=Math.max(0,shake-35*dt);flashA=Math.max(0,flashA-dt*1.6);els.flash.style.opacity=flashA;updateUI();}
function tile(im,y,alpha=1){if(!im)return;let dw=W,dh=H,off=y%H;ctx.globalAlpha=alpha;ctx.drawImage(im,0,off-H,dw,dh);ctx.drawImage(im,0,off,dw,dh);ctx.globalAlpha=1;}
function itemArt(kind,size){
 const s=size/100;ctx.save();ctx.scale(s,s);ctx.lineJoin="round";ctx.lineCap="round";ctx.lineWidth=5;ctx.strokeStyle="#4b2d25";
 const circle=(x,y,r,fill,stroke=true)=>{ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(stroke)ctx.stroke()};
 if(kind==="apple"){circle(-17,8,30,"#f23f4c");circle(17,8,30,"#ff5960");ctx.fillStyle="#5a3524";ctx.fillRect(-3,-39,7,23);ctx.fillStyle="#61bc55";ctx.beginPath();ctx.ellipse(17,-32,20,10,-.45,0,Math.PI*2);ctx.fill();ctx.stroke()}
 else if(kind==="strawberry"){ctx.fillStyle="#f43f66";ctx.beginPath();ctx.moveTo(-40,-23);ctx.bezierCurveTo(-38,-47,-7,-42,0,-23);ctx.bezierCurveTo(8,-44,39,-45,40,-22);ctx.bezierCurveTo(39,8,17,35,0,47);ctx.bezierCurveTo(-19,34,-39,8,-40,-23);ctx.fill();ctx.stroke();ctx.fillStyle="#64bd4e";for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(i*17,-31,20,8,i*.45,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#ffe27a";for(let y=-8;y<29;y+=17)for(let x=-20;x<=20;x+=20)circle(x+(y%2?5:0),y,2.4,"#ffe27a",false)}
 else if(kind==="donut"){circle(0,0,43,"#d99a57");ctx.strokeStyle="#ff98c4";ctx.lineWidth=17;ctx.beginPath();ctx.arc(0,0,31,0,Math.PI*2);ctx.stroke();circle(0,0,14,"#553a28");ctx.lineWidth=4;for(let i=0;i<9;i++){let a=i*.72;ctx.strokeStyle=["#fff36a","#66d9ff","#fff"][i%3];ctx.beginPath();ctx.moveTo(Math.cos(a)*25-4,Math.sin(a)*25);ctx.lineTo(Math.cos(a)*25+4,Math.sin(a)*25+3);ctx.stroke()}}
 else if(kind==="cake"){ctx.fillStyle="#fff1c7";ctx.beginPath();ctx.moveTo(-42,-27);ctx.lineTo(40,-15);ctx.lineTo(35,40);ctx.lineTo(-42,40);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#ff83ad";ctx.fillRect(-40,-3,77,13);ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-42,-27);ctx.lineTo(40,-15);ctx.lineTo(20,3);ctx.lineTo(-42,-5);ctx.closePath();ctx.fill();circle(8,-31,10,"#ec3950");ctx.strokeStyle="#4b8c43";ctx.beginPath();ctx.moveTo(9,-41);ctx.quadraticCurveTo(13,-53,25,-50);ctx.stroke()}
 else if(kind==="grapes"){ctx.fillStyle="#58a84d";ctx.beginPath();ctx.ellipse(17,-33,26,13,-.5,0,Math.PI*2);ctx.fill();ctx.stroke();for(let y=-19;y<=30;y+=21){let count=y>20?2:3;for(let x=0;x<count;x++)circle((x-(count-1)/2)*25+(y===2?3:0),y,16,"#8155cf")}}
 else if(kind==="burger"){ctx.strokeStyle="#613820";ctx.fillStyle="#f2a83f";ctx.beginPath();ctx.arc(0,-8,43,Math.PI,0);ctx.lineTo(43,-1);ctx.lineTo(-43,-1);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle="#55ad46";ctx.beginPath();ctx.moveTo(-44,3);for(let x=-44;x<=44;x+=14)ctx.lineTo(x,3+(x/14%2?8:0));ctx.lineTo(44,16);ctx.lineTo(-44,16);ctx.closePath();ctx.fill();ctx.fillStyle="#7b3f25";ctx.fillRect(-42,15,84,17);ctx.strokeRect(-42,15,84,17);ctx.fillStyle="#f1aa40";ctx.beginPath();ctx.roundRect(-44,31,88,21,10);ctx.fill();ctx.stroke()}
 else if(kind==="honey"){ctx.fillStyle="#ffd43b";ctx.beginPath();ctx.roundRect(-34,-28,68,71,16);ctx.fill();ctx.stroke();ctx.fillStyle="#f7a928";ctx.beginPath();ctx.roundRect(-42,-39,84,16,7);ctx.fill();ctx.stroke();ctx.fillStyle="#fff6b0";ctx.beginPath();ctx.roundRect(-26,-3,52,28,10);ctx.fill();ctx.fillStyle="#e8a51f";ctx.font="900 22px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("★",0,12)}
 else if(kind==="bomb"){circle(-3,7,37,"#26313b");ctx.strokeStyle="#66503b";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(16,-26);ctx.quadraticCurveTo(29,-46,42,-34);ctx.stroke();ctx.strokeStyle="#ffd638";ctx.lineWidth=6;for(let i=0;i<8;i++){let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(42+Math.cos(a)*7,-34+Math.sin(a)*7);ctx.lineTo(42+Math.cos(a)*18,-34+Math.sin(a)*18);ctx.stroke()}ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-15,-8,9,15,-.7,0,Math.PI*2);ctx.fill()}
 else if(kind==="boot"){ctx.fillStyle="#9a603b";ctx.beginPath();ctx.moveTo(-22,-43);ctx.lineTo(27,-43);ctx.lineTo(22,15);ctx.quadraticCurveTo(38,20,46,31);ctx.lineTo(43,43);ctx.lineTo(-40,43);ctx.quadraticCurveTo(-47,28,-29,19);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle="#e5b078";ctx.lineWidth=5;for(let y=-25;y<=4;y+=14){ctx.beginPath();ctx.moveTo(-10,y);ctx.lineTo(16,y+6);ctx.stroke()}}
 else if(kind==="skull"){circle(0,-7,40,"#eef1e5");ctx.fillStyle="#eef1e5";ctx.fillRect(-25,20,50,26);ctx.strokeRect(-25,20,50,26);circle(-15,-10,10,"#374039",false);circle(15,-10,10,"#374039",false);ctx.fillStyle="#374039";ctx.beginPath();ctx.moveTo(0,2);ctx.lineTo(-7,15);ctx.lineTo(7,15);ctx.closePath();ctx.fill();ctx.lineWidth=3;for(let x=-14;x<=14;x+=9){ctx.beginPath();ctx.moveTo(x,27);ctx.lineTo(x,44);ctx.stroke()}}
 ctx.restore();
}
function drawPlayer(){
 ctx.save();let bounce=Math.sin(player.bob)*3;ctx.translate(player.x+player.w/2,player.y+player.h/2+bounce);
 if(player.reaction==="happy"){let pulse=1+Math.sin(elapsed*30)*.055;ctx.translate(0,-12-Math.abs(Math.sin(elapsed*22))*12);ctx.rotate(Math.sin(elapsed*25)*.035);ctx.scale(pulse,pulse)}
 else if(player.reaction==="sad"){ctx.translate(0,8);ctx.rotate(-.055);ctx.scale(1,.94)}
 else if(player.reaction==="stun")ctx.rotate(Math.sin(elapsed*18)*.08);
 if(feverTime>0){ctx.shadowColor="#fff43d";ctx.shadowBlur=35;ctx.fillStyle="#fff56d";ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(0,0,player.w*.48,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 let playerImage=player.reaction==="stun"&&imgs.fainting?imgs.fainting:imgs.player;if(playerImage)ctx.drawImage(playerImage,-player.w/2,-player.h/2,player.w,player.h);else{ctx.fillStyle="#b8ce73";ctx.beginPath();ctx.arc(0,0,player.w*.38,0,Math.PI*2);ctx.fill()}
 ctx.filter="none";ctx.globalAlpha=1;ctx.textAlign="center";ctx.textBaseline="middle";
 if(player.reaction==="sad"){ctx.fillStyle="#63ceff";ctx.beginPath();ctx.ellipse(26,-27,7,14,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#5b3041";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-7,17,1.15*Math.PI,1.85*Math.PI);ctx.stroke()}
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);tile(imgs.background,bgY);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,"#112f1740");grad.addColorStop(1,"#fff2a008");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
for(let o of objects){ctx.save();ctx.translate(o.x+o.size/2,o.y+o.size/2);ctx.rotate(o.rot);if(o.t.rare){ctx.fillStyle="#fff36a";ctx.globalAlpha=.55+.25*Math.sin(elapsed*9);ctx.beginPath();ctx.arc(0,0,o.size*.68,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,o.size*.62,0,Math.PI*2);ctx.stroke()}itemArt(o.t.kind,o.size);ctx.restore()}
drawPlayer();
for(let r of rings){ctx.globalAlpha=r.a;ctx.strokeStyle=r.color;ctx.lineWidth=r.bad?8:5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.life*8);if(p.star){ctx.font=p.size*2+"px sans-serif";ctx.fillText("✦",0,0)}else ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore()}ctx.globalAlpha=1;for(let t of texts){ctx.globalAlpha=t.life;ctx.font="900 26px sans-serif";ctx.textAlign="center";ctx.strokeStyle="#17351f";ctx.lineWidth=5;ctx.strokeText(t.text,t.x,t.y);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y)}ctx.globalAlpha=1;if(lastRush){ctx.strokeStyle="#fff7a6";ctx.lineWidth=7;ctx.globalAlpha=.55;for(let i=0;i<8;i++){let y=(elapsed*900+i*190)%H;ctx.beginPath();ctx.moveTo(i%2?30:W-30,y);ctx.lineTo(i%2?85:W-85,y+120);ctx.stroke()}ctx.globalAlpha=1}tile(imgs.foreground,fgY,.93);ctx.restore();}
function updateUI(){els.score.textContent=score;els.time.textContent=Math.max(0,Math.ceil(60-elapsed));els.hearts.textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);els.time.style.color=lastRush?"#fff36a":"";els.bar.style.width=(feverTime>0?(feverTime/6*100):fever)+"%";els.bar.style.filter=feverTime>0?"brightness(1.5) drop-shadow(0 0 8px white)":"";}
function loop(now){if(!running)return;let dt=Math.min(.034,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
addEventListener("resize",resize);addEventListener("keydown",e=>{if(["ArrowLeft","a","A"].includes(e.key))keys.left=true;if(["ArrowRight","d","D"].includes(e.key))keys.right=true});addEventListener("keyup",e=>{if(["ArrowLeft","a","A"].includes(e.key))keys.left=false;if(["ArrowRight","d","D"].includes(e.key))keys.right=false});
function point(e){let p=e.touches?e.touches[0]:e,r=canvas.getBoundingClientRect();player.targetX=(p.clientX-r.left)*W/r.width}canvas.addEventListener("pointerdown",point);canvas.addEventListener("pointermove",e=>{if(e.buttons)point(e)});canvas.addEventListener("touchstart",point,{passive:false});canvas.addEventListener("touchmove",e=>{e.preventDefault();point(e)},{passive:false});addEventListener("pointerup",()=>player.targetX=null);addEventListener("touchend",()=>player.targetX=null);
function pollGamepadMenu(){let gp=activeGamepad(),pressed=!!(gp&&((gp.buttons[0]&&gp.buttons[0].pressed)||(gp.buttons[9]&&gp.buttons[9].pressed)));if(pressed&&!gamepadActionHeld&&!running&&(els.title.style.display!=="none"||els.result.style.display==="flex"))start();gamepadActionHeld=pressed;requestAnimationFrame(pollGamepadMenu)}
$("#start").onclick=start;$("#retry").onclick=start;resize();load().then(draw);requestAnimationFrame(pollGamepadMenu);
